services:
  - type: web
    name: portal-berita-bloger
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build:all
    startCommand: node dist-server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BLOGGER_BLOG_ID
        value: "4682143712664244285"
